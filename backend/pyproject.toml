[project]
name = "laptopbookcrm-backend"
version = "1.0.0"
description = "LaptopBookCRM Django backend"
requires-python = ">=3.13"

dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-cors-headers>=4.3,<5.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary]>=3.1.8,<4.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
